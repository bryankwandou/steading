<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Steading">
<!--
  The mark.

  First attempt was an arrow inside a rounded box. It rendered correctly at every size
  and it was still the wrong drawing: a downward arrow in a container is the single most
  common mark any downloader could choose, and a logo that could belong to a hundred
  other products is a placeholder no matter how well it is drawn.

  A steading is a farmstead - walls set around a yard, with one way in. That is the word
  this product was named for and it is also, exactly, what the product does: a place of
  your own, with a single opening, and what comes through the opening stays.

  So the enclosure is the subject and the arrow is only the gap in it. Two walls swing
  around a courtyard and stop short of meeting; the space they leave is the way in, and
  the notch cut into the courtyard reads as the descent. Nothing is drawn twice - the
  opening does the work an arrow glyph would have done, which is why it cannot be
  mistaken for anyone else's download icon.

  One 48-unit square, so it holds together at 16px in a browser tab where weight matters
  more than detail. Two tones: the walls sit back, the courtyard comes forward, and the
  eye is told which part is the point.
-->
<defs>
  <!-- The walls. Deeper at the foot, so the mark has a ground even with no baseline. -->
  <linearGradient id="st-wall" x1="10" y1="8" x2="38" y2="42" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4E92FF"/>
    <stop offset="1" stop-color="#0D3E96"/>
  </linearGradient>

  <!-- The courtyard: the lit half, and the thing being protected. -->
  <linearGradient id="st-yard" x1="24" y1="16" x2="24" y2="38" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1B6EF3"/>
    <stop offset="1" stop-color="#1558C8"/>
  </linearGradient>
</defs>

<!--
  Two walls, each a quarter-turn, leaving a gap at the top centre. Drawn as strokes with
  round caps so the opening has finished edges rather than cut ones - a wall that stops
  deliberately, not a shape with a piece missing.
-->
<path d="M21 8.6h-6.4A6 6 0 0 0 8.6 14.6v18.8a6 6 0 0 0 6 6h6.4"
      fill="none" stroke="url(#st-wall)" stroke-width="3.6" stroke-linecap="round"/>
<path d="M27 8.6h6.4a6 6 0 0 1 6 6v18.8a6 6 0 0 1-6 6H27"
      fill="none" stroke="url(#st-wall)" stroke-width="3.6" stroke-linecap="round"/>

<!--
  The courtyard, with a notch cut into its top edge. The notch is the whole idea: it
  points down through the gap between the walls, so the eye reads an entrance without an
  arrow ever being drawn. Cut with the path itself rather than a mask, so it survives
  being rendered by anything that can draw an SVG at all.
-->
<path d="M18.4 16.6h4.1l1.5 2.2 1.5-2.2h4.1a3 3 0 0 1 3 3v10.6a3 3 0 0 1-3 3H18.4a3 3 0 0 1-3-3V19.6a3 3 0 0 1 3-3Z"
      fill="url(#st-yard)"/>

<!--
  The floor inside the courtyard: what was set down. Cut out of the fill rather than
  painted on top, so it stays legible when the mark is small and the two blues merge.
-->
<path d="M19.6 28.4h8.8v2.6h-8.8z" fill="#fff" opacity=".9"/>
</svg>
